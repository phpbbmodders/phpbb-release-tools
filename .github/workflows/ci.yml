name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ShellCheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck git-release.sh git-release-langpack.sh tests/test-release-scripts.sh phpbb-test-board/setup-board.sh tests/test-phpbb-test-board.sh

      - name: Tests
        run: tests/test-release-scripts.sh

      - name: phpbb-test-board option tests
        run: tests/test-phpbb-test-board.sh
